name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
          - name: mvc
            dockerfile: docker/Dockerfile.mvc

    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} Docker image
        run: docker build . --file "${{ matrix.dockerfile }}" --tag "raceday-${{ matrix.name }}:${{ github.sha }}"
